profile = "mutants"

# Output meant for people, and helpers only tests use: a mutant there is something a person would
# see before any test could fail on it. Anything else no test can tell from the original goes here
# too, with the reason.
exclude_globs = [
    "crates/cli/src/visualization.rs",     # PNG pictures of designs, judged by eye
    "crates/cli/src/view.rs",              # the view command's picture
    "crates/cli/src/ui.rs",                # terminal colours and layout
    "crates/cli/src/logger.rs",            # log line styling
    "crates/router/src/detailed/trace.rs", # debugging logs of chosen nets
    "crates/common/src/memory.rs",         # resident memory, for log lines and the report
    "crates/common/src/testing.rs",        # helpers for tests
]
exclude_re = [
    "<impl (\\w+::)*Debug for ",           # debug printing
    "replace resident -> String",          # the memory figure in the router's log lines
    # The CLI's debug logs and progress rows, shown while a step runs; its summaries are tested.
    "replace (log_markers|log_opens|show_global_progress|show_setup_progress|show_timing_round) with \\(\\)",
    "delete ! in log_markers",             # whether the debug log is on
    "replace describe_violation -> String", # a placement violation's debug log line
    # The timing round's number, shown only in its progress row.
    "replace \\+= with \\*= in <impl TimingDriver for TimingPlacement<'_>>::repair",
    # A single-precision share is never the double 0.1 the limits are compared with.
    "replace < with <= in trim_and_sort",
    # Only 1 - epsilon lies epsilon from the far corner, and the curve puts it where the corner is.
    "replace < with <= in theta",
    # A silhouette of -1 needs every sink on the other cluster's mean, which is its own centroid.
    "replace > with >= in Clustering::run",
    # No distance a sink can have, to the power, is exactly i32::MAX.
    "replace < with <= in arc_cost",
]
