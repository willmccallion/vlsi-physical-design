purpose = "place_and_route"

[input]
lef_files = ["inputs/orfs/OpenROAD-flow-scripts-26Q2/flow/platforms/nangate45/lef/NangateOpenCellLibrary.tech.lef", "inputs/orfs/OpenROAD-flow-scripts-26Q2/flow/platforms/nangate45/lef/NangateOpenCellLibrary.macro.mod.lef"]
liberty_files = ["inputs/orfs/OpenROAD-flow-scripts-26Q2/flow/platforms/nangate45/lib/NangateOpenCellLibrary_typical.lib"]
def_file = "inputs/openroad/ibex/ibex_orfs.def"
output_def = "output/ibex/placed.def"

[global_placement]
placer_max_iterations = 2000

[io_placement]
horizontal_layer = "metal5"
vertical_layer = "metal6"

[netlist]
dont_use = ["TAPCELL_X1", "FILLCELL_X1", "AOI211_X1", "OAI211_X1"]
clock_ports = ["clk_i"]
