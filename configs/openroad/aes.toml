purpose = "place_and_route"

[input]
lef_files = ["inputs/orfs/OpenROAD-flow-scripts-26Q2/flow/platforms/nangate45/lef/NangateOpenCellLibrary.tech.lef", "inputs/orfs/OpenROAD-flow-scripts-26Q2/flow/platforms/nangate45/lef/NangateOpenCellLibrary.macro.mod.lef"]
