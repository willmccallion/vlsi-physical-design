name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Configs are what download.py writes
        run: |
          python3 scripts/download.py --configs
          git diff --exit-code configs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D rustdoc::all

  # Line coverage of the product code fails below 90%. Test code lives in files of its own
  # (tests.rs, tests/, testing.rs, testing/, fixtures.rs), which the count leaves out.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml's toolchain, llvm-tools included.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: >-
          cargo llvm-cov --workspace --locked --summary-only --fail-under-lines 90
          --ignore-filename-regex '(^|/)(\w+_)?tests(/|\.rs$)|/(testing|fixtures)(\.rs$|/)'
