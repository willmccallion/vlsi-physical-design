[workspace]
members = [
    "crates/common",
    "crates/placer",
    "crates/router",
    "crates/cli",
]
resolver = "2"

[workspace.package]
description = "PARE — Placement And Routing Engine: a digital IC physical design tool written in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/will/vlsi-physical-design"
readme = "README.md"
keywords = ["vlsi", "eda", "placement", "routing", "physical-design"]
categories = ["science", "algorithms", "simulation"]

[profile.release]
debug = true

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unused_results = "warn"
unsafe_code = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
# Strong baseline
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Every unsafe block must have a `// SAFETY:` comment explaining correctness
undocumented_unsafe_blocks = "deny"

# Strictness on panics/WIP code
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"

# Style/naming allows
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
inline_always = "allow"

# Cast allows: coordinate arithmetic and grid index calculations require
# intentional conversions between i32/u32/f64/usize throughout the codebase.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"

# These fire on reasonable code patterns in this codebase
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_pub_crate = "allow"
option_if_let_else = "allow"
multiple_crate_versions = "allow"
match_same_arms = "allow"

[workspace.lints.rustdoc]
all = "deny"
missing_crate_level_docs = "deny"
broken_intra_doc_links = "deny"
