[workspace]
members = [
    "crates/common",
    "crates/verify",
    "crates/placer",
    "crates/router",
    "crates/resizer",
    "crates/cts",
    "crates/cli",
]
resolver = "2"

[workspace.package]
description = "PARE — Placement And Routing Engine: a digital IC physical design tool written in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/willmccallion/vlsi-physical-design"
readme = "README.md"
keywords = ["vlsi", "eda", "placement", "routing", "physical-design"]
categories = ["science", "algorithms", "simulation"]

[profile.release]
debug = true
lto = "fat"
codegen-units = 1

# cargo mutants builds with this (.cargo/mutants.toml): the tests route whole fixtures, which an
# optimized build runs many times faster than a debug one.
[profile.mutants]
inherits = "test"
opt-level = 1
debug = "none"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unused_results = "warn"
unsafe_code = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
# Strong baseline
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Every unsafe block must have a `// SAFETY:` comment explaining correctness
undocumented_unsafe_blocks = "deny"

# Strictness on panics/WIP code
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"

# Style/naming allows
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
inline_always = "allow"

# Integer-to-float conversions in geometry, density and timing maths lose
# precision far below a database unit; every other numeric conversion goes
# through pare_common::convert or TryFrom.
cast_precision_loss = "allow"

# These fire on reasonable code patterns in this codebase
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_pub_crate = "allow"
option_if_let_else = "allow"
multiple_crate_versions = "allow"
match_same_arms = "allow"

[workspace.lints.rustdoc]
all = "deny"
missing_crate_level_docs = "deny"
broken_intra_doc_links = "deny"
