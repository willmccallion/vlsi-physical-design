[package]
name = "pare-common"
version = "0.1.0"
edition = "2024"
description = "PARE — Placement And Routing Engine: shared data structures and parsers"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
log = "0.4"
rayon = "1.10"
proptest = { version = "=1.11.0", default-features = false, features = ["std"], optional = true }

[features]
# Helpers for the workspace's tests, such as golden files and generated designs.
testing = ["dep:proptest"]

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
toml = "0.8"
