[package]
name = "pare-common"
version = "0.1.0"
edition = "2024"
description = "PARE — Placement And Routing Engine: shared data structures and parsers"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
image = "0.24"
imageproc = "0.23"
log = "0.4"
rayon = "1.10"
rstar = "0.13"
env_logger = "0.11"
yansi = { version = "1.0", features = ["detect-tty", "detect-env"] }

[dev-dependencies]
toml = "0.8"
